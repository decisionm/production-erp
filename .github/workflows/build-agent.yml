name: Build Tally Sync Agent

# Builds the Windows installer for the local Tally Sync Agent, and — as a
# SEPARATE, DELIBERATE act — publishes it to the ERP server's public storage,
# where the Tally Settings page links to it as a download.
#
# THE TWO PATHS, and the difference matters:
#   * A push to main (or any run of this workflow that is not a publishing
#     dispatch) BUILDS A CANDIDATE ARTIFACT ONLY. It uploads the installer for
#     review and stops. Merging does NOT reach the factory.
#   * Publishing happens only when a human runs "Run workflow" ON MAIN with
#     publish=true, after the candidate has been reviewed. Publishing updates
#     the auto-update feed, so the running factory agent self-updates to that
#     build within hours — publishing IS deploying to the factory floor.
#
# Runs ONLY when the agent's own code (or this workflow) changes — not on
# every push.

on:
  push:
    branches: [main]
    paths:
      - 'tally-sync-agent/**'
      # This workflow governs what reaches the factory, so a change to it must
      # itself be built and reviewed rather than landing unexercised.
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          DANGER — PUBLISHING IS DEPLOYING TO THE FACTORY. Setting this true
          uploads to the ERP's live storage AND the auto-update feed, and the
          running factory agent will self-update to this build within hours
          with no further human step. Only ever set true ON MAIN, and only
          after the candidate artifact has been reviewed. Leave false to build
          the installer as a downloadable artifact for review or hand-install.
          A dispatch from any branch other than main CANNOT publish even with
          this set true.
        type: boolean
        default: false

concurrency:
  group: build-agent
  # NEVER cancel a run in progress. This job packages and can upload an
  # installer to live storage; a newer run cancelling one mid-publish is how a
  # half-written feed or a truncated installer reaches the factory. Queue
  # behind it instead — a slower pipeline is the correct trade here.
  cancel-in-progress: false

jobs:
  # Electron NSIS installers are built natively on Windows.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tally-sync-agent/package-lock.json

      - name: Install deps
        working-directory: tally-sync-agent
        run: npm ci

      # GATE THE PACKAGING, not just the merge. Everything below runs BEFORE
      # package:win, so a failing contract or a vulnerable toolchain produces
      # no installer at all — there is nothing to review, and nothing that
      # could later be published by mistake.
      - name: Voucher + release contract tests
        working-directory: tally-sync-agent
        run: npm test

      # Deliberately NOT --omit=dev: electron-builder and its tree are what
      # BUILD the installer that auto-updates the factory PC, so a compromised
      # packaging dependency is a supply-chain path to the floor even though
      # it never ships inside the artifact. The runtime-only audit would pass
      # while that risk sat unexamined.
      - name: Audit build + runtime dependencies
        working-directory: tally-sync-agent
        run: npm audit --audit-level=high

      - name: Build Windows installer
        working-directory: tally-sync-agent
        run: npm run package:win

      # Normalise the output to a stable filename (electron-builder names it
      # "Tally Sync Agent Setup <version>.exe") and emit a small metadata file
      # the Settings page reads for version/date.
      - name: Stage artifact
        working-directory: tally-sync-agent
        shell: bash
        run: |
          mkdir -p out
          # Ship the raw electron-builder output so electron-updater can consume
          # latest.yml + the versioned installer (+ blockmap for delta updates).
          cp release/*.exe out/
          cp release/*.blockmap out/ 2>/dev/null || true
          cp release/latest.yml out/
          # Metadata the Settings page reads for the download link/version.
          # sha256 included so a truncated/corrupted download is detectable
          # against the published checksum.
          node -e "const p=require('./package.json'); const fs=require('fs'); const crypto=require('crypto'); const filename='tally-sync-agent-setup-'+p.version+'.exe'; const sha256=crypto.createHash('sha256').update(fs.readFileSync('out/'+filename)).digest('hex'); fs.writeFileSync('out/tally-sync-agent-latest.json', JSON.stringify({ version: p.version, commit: (process.env.GITHUB_SHA || '').slice(0, 7), filename, sha256, built_at: new Date().toISOString() }))"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: agent-installer
          path: tally-sync-agent/out/
          retention-days: 7

  # Publish over SSH from Ubuntu (reuses the deploy key + proven SSH tooling).
  # Publishing is the moment this build reaches the live factory: latest.yml
  # on the feed makes the running agent self-update within hours.
  #
  # ALL THREE CONDITIONS ARE REQUIRED, and each blocks a real mistake:
  #   event_name == 'workflow_dispatch'  a push can never publish. Merging to
  #                                      main builds a candidate for review and
  #                                      stops there.
  #   inputs.publish == true             a human ticked the box, tested against
  #                                      true EXPLICITLY rather than for
  #                                      truthiness. (This input exists only on
  #                                      workflow_dispatch; on a push it is
  #                                      null, so the event guard is
  #                                      load-bearing rather than decorative.)
  #   github.ref == 'refs/heads/main'    a dispatch from a feature branch
  #                                      cannot publish even with publish=true.
  #                                      Only reviewed, merged code reaches the
  #                                      factory.
  publish:
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.publish == true
      && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The checker runs from the repo, so check out THE SAME SHA this run is
      # publishing — not a moving branch tip.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: agent-installer
          path: out

      # Read-only fetch of the metadata the factory is currently being served.
      #
      # THIS READ MUST NOT BE STALE. The whole gate turns on comparing against
      # what is live RIGHT NOW; a cached copy from before the previous publish
      # would report an older version and wave through a republish or even a
      # rollback — the exact failures the gate exists to stop. So the request
      # is made uncacheable three ways: no-cache request headers for
      # well-behaved caches, and a per-run cache-buster query for the ones that
      # ignore headers. The buster is derived from the run id, the attempt and
      # the commit, so no two runs — including re-runs of the same commit —
      # can share a cache entry.
      #
      # --fail so an HTTP error is an error rather than an HTML error page
      # saved as JSON; bounded retries and timeouts so a hung request cannot
      # stall the run indefinitely. If this cannot be read, the next step
      # blocks the publish — never assume a first publish.
      - name: Fetch currently published metadata
        env:
          FEED_URL: https://erp.actech.co.in/storage/agent/tally-sync-agent-latest.json
        run: |
          CACHE_BUSTER="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          curl --fail --show-error --silent \
               --header 'Cache-Control: no-cache, no-store, max-age=0' \
               --header 'Pragma: no-cache' \
               --retry 3 --retry-delay 2 --retry-connrefused \
               --connect-timeout 10 --max-time 30 \
               -o published.json \
               "${FEED_URL}?cachebust=${CACHE_BUSTER}"
          echo "fetched published metadata:"; cat published.json

      # THE GATE. Runs BEFORE any SSH key is written and before anything is
      # uploaded: an equal or lower version, a filename disagreeing with its
      # own version, or an artifact built from a different commit than this
      # run all stop the publish here, with nothing touched.
      - name: Assert this candidate advances on what is published
        run: |
          node tally-sync-agent/scripts/assert-version-advance.js \
            --candidate out/tally-sync-agent-latest.json \
            --published published.json \
            --commit "$(echo "${GITHUB_SHA}" | cut -c1-7)"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Was: ssh-keyscan ... >> known_hosts 2>/dev/null — which threw away the
          # reason on failure AND never checked that a key was actually collected,
          # so an empty scan surfaced later as a confusing scp error. This is the
          # PUBLISH path to the factory floor, so it gets the same guarded,
          # retrying form as every other workflow: the host intermittently answers
          # nothing and a re-run of the same commit has always cleared it.
          keys=""
          for attempt in 1 2 3; do
            keys=$(ssh-keyscan -T 15 -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}") || true
            if [ -n "$keys" ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "ssh-keyscan attempt ${attempt} returned no host key; retrying in $((attempt * 10))s"
              sleep "$((attempt * 10))"
            fi
          done
          if [ -z "$keys" ]; then
            echo "::error::The host returned no SSH host key after three attempts, so the installer cannot be published. Check hPanel → Advanced → SSH Access and whether brute-force protection has banned the runner."
            exit 1
          fi
          printf '%s\n' "$keys" >> ~/.ssh/known_hosts

      - name: Upload installer + update feed to the ERP's public storage
        # ATOMIC publish: the ~90MB scp takes minutes, and the web server
        # serves this directory the whole time — uploading straight to the
        # final filename hands truncated installers (NSIS "integrity check
        # failed") to anyone downloading mid-publish. So: upload everything
        # into a hidden staging dir on the same filesystem, then mv into
        # place — renames are instantaneous — with the metadata json moved
        # LAST, so the Settings page's download link never points at a file
        # that isn't fully there yet.
        run: |
          DEST="${{ secrets.DEPLOY_PATH }}/backend/storage/app/public/agent"
          STAGE="$DEST/.incoming"
          # Create the dirs and drop the old stable-named installer from the first build.
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '$STAGE' && rm -f '$DEST/tally-sync-agent-setup.exe' '$STAGE'/*"
          scp -i ~/.ssh/deploy_key -P "${{ secrets.SSH_PORT }}" \
            out/* \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$STAGE/"
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -e; cd '$STAGE' \
              && mv -f *.exe '$DEST/' \
              && { mv -f *.blockmap '$DEST/' 2>/dev/null || true; } \
              && { mv -f latest.yml '$DEST/' 2>/dev/null || true; } \
              && mv -f tally-sync-agent-latest.json '$DEST/' \
              && cd '$DEST' && rmdir '$STAGE'"
          # Keep only the 5 newest installers (+ their blockmaps) to bound
          # storage growth; latest.yml and the metadata json always stay. A few
          # older builds are retained as fallbacks rather than only the latest.
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '$DEST' && ls -1t tally-sync-agent-setup-*.exe 2>/dev/null | tail -n +6 | sed 's/.*/& &.blockmap/' | xargs -r rm -f; echo 'installers kept:'; ls -1 tally-sync-agent-setup-*.exe 2>/dev/null"
