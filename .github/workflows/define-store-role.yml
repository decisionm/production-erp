name: Define the Store role

# Creates the Store role on the live instance, fixes its permission set, and
# optionally gives it to ONE named login. Dry by default: without write=true
# it prints exactly what it would add, remove, rename and assign, and changes
# nothing.
#
# WHY THIS IS A WORKFLOW AND NOT A SEEDER. PermissionSeeder runs on every
# deploy, and its own note says it must only ever ADD its one permission and
# never rewrite what an administrator granted through the Roles screen.
# Creating a role and fixing its grants is a live master-data change, and
# AGENTS.md is explicit that those go through a manual workflow, dry-run
# first, written only after a person has read the dry run. Shipping it as a
# seeder would make an authorization change a side effect of deploying code.
#
# THE ROLE WAS "Storekeeper" UNTIL 02-Sep-2026. If the live instance already
# holds a "Storekeeper" role and no "Store" role, the command renames it in
# place and its holders keep it — the dry run says so in as many words.
#
# ASSIGNMENT IS EXPLICIT OR NOT AT ALL. Which people keep the store is a fact
# about the factory that the repository cannot know, and a role granted to
# the wrong login is an authorization incident. Leave `assign` blank and
# nobody is assigned; fill it with the exact email (or exact name) of ONE
# existing, active login and the dry run prints who that resolves to before
# the write. Zero matches, several matches and an inactive login are refused.
# A login is never created here — that is the Users screen's job.
#
# READ `roles:show` FIRST. Roles are created at runtime and never seeded, so
# the only way to know what a live role holds today is to read it off the live
# database — the "Show roles" workflow does exactly that, read-only. The dry
# run below also prints the difference, but seeing the whole board first is
# the habit that catches the surprise.

# Least privilege: nothing here writes to the repository. Every workflow uses
# only checkout, setup-node/php and same-run artifacts, and reaches the server
# over SSH with a deploy key — never the GITHUB_TOKEN.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      write:
        description: 'Actually write. Leave false for a dry run that changes nothing.'
        type: boolean
        default: false
      assign:
        description: 'Exact email (or exact name) of ONE existing login to give the Store role to. Leave blank to assign nobody.'
        type: string
        default: ''

concurrency:
  group: define-store-role
  cancel-in-progress: false

jobs:
  define:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          keys=""
          for attempt in 1 2 3; do
            keys=$(ssh-keyscan -T 15 -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}") || true
            if [ -n "$keys" ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "ssh-keyscan attempt ${attempt} returned no host key; retrying in $((attempt * 10))s"
              sleep "$((attempt * 10))"
            fi
          done
          if [ -z "$keys" ]; then
            echo "::error::The host returned no SSH host key. Check hPanel → Advanced → SSH Access, and whether brute-force protection has banned the runner. Re-running often clears a transient failure."
            exit 1
          fi
          printf '%s\n' "$keys" >> ~/.ssh/known_hosts

      # Inputs cross into shell ONLY via env. A `${{ }}` expression pasted into
      # script text is substituted as TEXT before bash parses the line, so the
      # value becomes code; env makes it data.
      - name: Report what is about to run
        env:
          WRITE_RAW: ${{ inputs.write }}
          ASSIGN_RAW: ${{ inputs.assign }}
        run: |
          if [ "$WRITE_RAW" = "true" ]; then
            if [ -n "$ASSIGN_RAW" ]; then
              echo "::warning::WRITING the Store role and its permissions on the live instance, and assigning it to the login '$ASSIGN_RAW'."
            else
              echo "::warning::WRITING the Store role and its permissions on the live instance. No user is assigned."
            fi
          else
            echo "Dry run — nothing will be written."
          fi

      # The assign value is passed to artisan as a single-quoted argument with
      # any single quote inside it escaped, so an email is data on the remote
      # shell too. A leading dash would be read by artisan as another option
      # rather than a value, and is refused here rather than on the server.
      - name: Run it
        env:
          WRITE_RAW: ${{ inputs.write }}
          ASSIGN_RAW: ${{ inputs.assign }}
        run: |
          set -o pipefail

          FLAGS=""
          [ "$WRITE_RAW" = "true" ] && FLAGS="--write"

          ASSIGN_ARG=""
          if [ -n "$ASSIGN_RAW" ]; then
            case "$ASSIGN_RAW" in
              -*)
                echo "::error::assign must be an email or a name, not something starting with a dash. Got: '$ASSIGN_RAW'"
                exit 1
                ;;
            esac
            ESCAPED=$(printf '%s' "$ASSIGN_RAW" | sed "s/'/'\\\\''/g")
            ASSIGN_ARG="--assign='$ESCAPED'"
          fi

          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}/backend' && \$(bash scripts/pick-php.sh 2>/dev/null || echo /opt/alt/php84/usr/bin/php) artisan roles:define-store $FLAGS $ASSIGN_ARG" \
            2>&1 | tee output.txt

      - name: Summarise
        if: always()
        env:
          WRITE_RAW: ${{ inputs.write }}
          ASSIGN_RAW: ${{ inputs.assign }}
        run: |
          {
            echo '### Define the Store role'
            echo ''
            echo "write: \`$WRITE_RAW\`"
            echo "assign: \`${ASSIGN_RAW:-(nobody)}\`"
            echo ''
            echo 'Only the login named in `assign` is ever given the role. Add or remove others on the Roles screen.'
            echo ''
            echo '```'
            tail -c 60000 output.txt 2>/dev/null || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
