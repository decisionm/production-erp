name: Deploy to Hostinger

# One push to `main` = full deploy of both frontend and backend.
#
# Why CI instead of building on the server: the Hostinger plan has no Node
# over SSH, so the React/Vite build must happen off-server. GitHub's runner
# has Node, builds the frontend into backend/public/build, then rsyncs the
# whole backend/ (built frontend included) to the server. rsync --delete
# makes the server match the repo exactly (no missed/stale files), while the
# --exclude list protects everything that must NOT be touched on deploy:
# .env (DB creds, APP_KEY), storage/ (logs, sessions, uploads) and vendor/
# (rebuilt on the server by composer). CI never sees production secrets.

# Least privilege: nothing here writes to the repository. Every workflow uses
# only checkout, setup-node/php and same-run artifacts, and reaches the server
# over SSH with a deploy key — never the GITHUB_TOKEN. Without this block the
# token is repository-default, which on a push-triggered workflow that runs
# `npm ci` (arbitrary lockfile postinstall) is a write-capable token one
# compromised transitive dependency away from the pipeline that rsyncs to a
# live factory. Read is all any of these need.
permissions:
  contents: read

on:
  push:
    branches: [main]
    # Docs-only pushes (decision records, planning docs, READMEs) don't change
    # what runs on the server — skip the full build-test-rsync cycle for them.
    # A push touching BOTH docs and code still deploys: paths-ignore only skips
    # the run when every changed file matches.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never interrupt an in-flight deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The app is CLOSED from "Enter maintenance mode" until artisan up at the end
    # of scripts/deploy.sh. Every FAILURE in that window announces itself with a
    # red X and fires an explainer step. A HANG does not: both explainers are
    # gated on failure()/cancelled(), so a stalled SSH session, a composer wait on
    # a dead mirror, or a MySQL connection that hangs rather than refuses (this
    # host throws intermittent [HY000] [2002]) would sit on GitHub's 360-minute
    # default with the run showing "in progress" and the factory at 503, silently.
    # A whole server-side deploy is ~90s; 25 minutes is generous and converts the
    # only silent outage in the pipeline into a failed run that explains itself.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Build the frontend (this is the step the server cannot do) ---
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build   # writes into ../backend/public/build (see vite.config.ts)

      # --- The gate: nothing ships until the suite is green ---
      #
      # This job used to rsync straight after the frontend build. Pull requests
      # run ci.yml, so the only thing standing between a broken commit and the
      # factory's live instance was the habit of opening a PR — a direct push to
      # main (or a "Run workflow" click) deployed code no test had ever seen.
      # The same checks now run here, in this job, BEFORE the rsync step: any
      # non-zero exit fails the job and the server is never touched.
      #
      # Deliberately identical to ci.yml's `app` job rather than a second
      # invention that could drift from it — same PHP version, same extensions,
      # same commands. Two notes on why it looks the way it does:
      #   * It sits AFTER the frontend build on purpose (ci.yml's header explains
      #     it: a smoke test hits "/" and 500s if backend/public/build/index.html
      #     does not exist yet).
      #   * The suite runs on in-memory sqlite because backend/phpunit.xml pins
      #     DB_CONNECTION=sqlite / DB_DATABASE=":memory:" AND no DB_* variable is
      #     set in this job's environment. Note the second half: PHPUnit applies
      #     a non-force <env> only when the variable is absent from the process
      #     environment, so a job-level DB_CONNECTION=mysql WOULD switch the
      #     driver (that is exactly how ci.yml's `app-mysql` leg runs the same
      #     suite against MySQL 8 with no second phpunit config). This gate
      #     stays on sqlite deliberately — it is the fast leg, and slowing the
      #     deploy buys nothing the PR's `app-mysql` check has not already
      #     proven for the commit being deployed.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # composer.lock pins Symfony v8 packages that require PHP >= 8.4.1
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_sqlite, sqlite3, zip
          coverage: none

      # Dev dependencies included — pint and phpunit are the point of this gate.
      # They cannot leak into production: vendor/ is rsync-excluded below and is
      # rebuilt on the server with --no-dev by scripts/deploy.sh.
      - name: Install composer dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Pint (style)
        working-directory: backend
        run: ./vendor/bin/pint --test

      # The .env written here is the runner's throwaway testing env, never the
      # server's — .env is on the rsync --exclude list below.
      - name: Backend tests
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

      # Names the failure instead of leaving a red X to interpret. Only fires if
      # something above went red, in which case the rsync below never ran.
      - name: Explain a failed gate
        if: failure()
        run: |
          echo "::error::Deploy aborted BEFORE the rsync — the pre-deploy gate failed, so the server still runs the previous release and nothing was copied to it. Open the first red step above: 'Type-check frontend' / 'Build frontend' means the SPA does not compile, 'Pint (style)' means PHP style (run ./vendor/bin/pint in backend/ and push), 'Backend tests' means the suite is red (reproduce with php artisan test in backend/). Fix on a branch and merge — re-running this workflow on the same commit will fail again."

      # --- Ship it ---
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan's stderr says WHY the host did not answer (refused,
          # timed out, no route). It used to go to /dev/null, so the whole
          # deploy failed as a bare "exit code 1" with nothing to act on.
          # Exit status alone is not a sufficient check either — ssh-keyscan
          # can exit 0 having collected no key at all, which would then fail
          # later and more confusingly at the rsync step.
          # The host intermittently answers nothing: 10 of the last 100 runs failed
          # here, and EVERY one cleared on a re-run of the SAME commit — it is the
          # host, not the change. Retrying in-workflow removes that manual re-run.
          # It does NOT weaken the check: if all three attempts come back empty the
          # step still fails loudly, which is the state that must never deploy.
          keys=""
          for attempt in 1 2 3; do
            keys=$(ssh-keyscan -T 15 -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}") || true
            if [ -n "$keys" ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "ssh-keyscan attempt ${attempt} returned no host key; retrying in $((attempt * 10))s"
              sleep "$((attempt * 10))"
            fi
          done
          if [ -z "$keys" ]; then
            echo "::error::The deploy host returned no SSH host key. The website itself can be perfectly healthy while this fails — this step only proves the SSH service answered. Check hPanel → Advanced → SSH Access (it can be turned off or IP-restricted) and whether the host's brute-force protection has banned the runner."
            exit 1
          fi
          printf '%s\n' "$keys" >> ~/.ssh/known_hosts

          # --- SSH connection multiplexing: THREE authenticated sessions -> ONE ---
          #
          # This host runs brute-force protection that bans the runner IP for
          # rapid consecutive SSH sessions (see the deploy-live-verify skill:
          # two bans in one night on 11-Aug-2026). The deploy authenticates
          # three times — maintenance, rsync, deploy.sh — and adding the
          # maintenance step made that risk MATERIAL rather than merely untidy:
          # a ban tripping AFTER the app is closed but BEFORE the rsync would
          # strand the factory at 503, with the runner unable to reconnect and
          # the sanctioned recovery (re-run) being the very thing that extends
          # the ban.
          #
          # ControlMaster makes the first connection carry the other two over
          # the same TCP session, so the deploy authenticates ONCE — fewer
          # connections than before this window existed. Every ssh/rsync below
          # must pass $SSH_MUX or it opens its own session and the guarantee is
          # gone.
          mkdir -p ~/.ssh/cm
          echo "SSH_MUX=-o ControlMaster=auto -o ControlPath=$HOME/.ssh/cm/%r@%h:%p -o ControlPersist=600" >> "$GITHUB_ENV"

      # --- Close the app BEFORE the code changes underneath it ---------------
      #
      # The window this closes is real and was paid for on 11-Aug-2026: the
      # rsync below succeeded, `artisan migrate` then died on a transient DB
      # refusal, and live sat on NEW CODE with the OLD SCHEMA. Reads degraded
      # silently (Eloquent returns null for a column that is not there) while
      # every write touching a new column would have thrown — completing a
      # batch, saving a packing option. Nothing rolled back on its own.
      #
      # So the app goes down before the first byte moves and comes back up
      # only after migrations have actually succeeded (the `artisan up` at the
      # end of scripts/deploy.sh, which `set -e` skips on any failure). A
      # deploy that breaks now leaves a 503, not a half-migrated instance
      # serving broken writes to the floor.
      #
      # Uses the OLD code still on the server. `--render` pre-renders the 503 at
      # down time and bakes the HTML into storage/framework/down, so
      # maintenance.php serves it with ZERO framework boot — which matters
      # because `composer install --no-dev` is actively rewriting vendor/ during
      # the window, and a 503 that needs a full boot out of a half-rewritten
      # tree returns a PHP fatal 500 instead. `|| ...` falls back to a plain
      # `down` for the one deploy where the view is not on the server yet.
      # Note the limit: maintenance.php short-circuits HTML only, so JSON
      # clients (the SPA's API calls, the Tally agent) boot either way.
      #
      # --retry is the Retry-After the closed app sends back. It must exceed a
      # WHOLE server-side deploy (composer + dump + migrate + seeders + four
      # cache rebuilds ~ 90s on 11-Aug, and a slow one is longer), or a client
      # honouring it retries into an app that is still closed. 300 is loose on
      # purpose — nothing is harmed by a client waiting slightly too long.
      #
      # `id` so the explainer below can tell "closed, then something failed"
      # from "never closed at all" — those need opposite instructions.
      - name: Enter maintenance mode
        id: maintenance
        run: |
          ssh $SSH_MUX -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}/backend' && { /opt/alt/php84/usr/bin/php artisan down --render=errors::503 --retry=300 || /opt/alt/php84/usr/bin/php artisan down --retry=300; }"

      # NOTE ON --exclude='storage/': it is LOAD-BEARING for the maintenance
      # window above. `artisan down` writes storage/framework/down and
      # storage/framework/maintenance.php, so excluding storage/ is what keeps
      # the app closed ACROSS this --delete rsync. Removing that exclusion
      # would reopen the app mid-deploy, on new code and an unmigrated schema.
      # Do not "tidy" it away.
      - name: Rsync backend to server
        run: |
          rsync -az --delete \
            -e "ssh $SSH_MUX -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/' \
            --exclude='public/storage' \
            --exclude='public/hot' \
            backend/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/backend/"

      - name: Run server-side deploy tasks
        run: |
          ssh $SSH_MUX -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}/backend' && bash scripts/deploy.sh"

      # The app is DOWN at this point and stays down on purpose. Say so loudly:
      # the previous failure mode was a green-looking server quietly serving a
      # half-migrated instance, and a 503 nobody explains is its own incident.
      # Keyed on `== 'success'` rather than `!= 'skipped'`: a step skipped
      # because an EARLIER step failed may report 'skipped' or empty depending
      # on the runner, and `!= 'skipped'` fires on empty — stacking a false
      # "stopped at the maintenance step" annotation on top of the correct one
      # from "Explain a failed gate". `cancelled()` is included because
      # failure() excludes it: an operator cancelling a deploy that looks hung
      # would otherwise close the app and be told nothing at all.
      - name: Explain a deploy that stopped with the app closed
        if: (failure() || cancelled()) && steps.maintenance.outcome == 'success'
        run: |
          echo "::error::The app is in MAINTENANCE MODE and has been left that way deliberately — it is serving 503, not broken writes. The code may or may not have synced, so the schema may not match it. DO NOT bring it up blind. Read the failing step above: if 'artisan migrate' failed, the pre-migration backup was already taken and is named in the log (~/backups/erp/erp-db-*.sql). Fix the cause, re-run this workflow (it is idempotent and takes a fresh backup), and the deploy brings the app back up itself. IF SSH IS BANNED and you cannot re-run: the app can be reopened WITHOUT SSH by deleting storage/framework/down and storage/framework/maintenance.php in hPanel's file manager — that is exactly what 'artisan up' does. Only do that if the rsync did NOT land, i.e. the schema was never touched; reopening after a partial deploy puts the floor on code whose migrations never ran, which is the state this window exists to prevent."

      # Separate message for the opposite state. It deliberately does NOT claim
      # the app is up: a PREVIOUS failed deploy may have left it closed, and
      # this run cannot observe that. Asserting "still UP and serving" here was
      # wrong — on the documented fix-and-re-run path it is the likeliest way
      # for an operator to be told the floor is fine while it serves 503.
      - name: Explain a deploy that stopped before the app was closed
        if: (failure() || cancelled()) && steps.maintenance.outcome == 'failure'
        run: |
          echo "::error::This run stopped AT the maintenance step, so THIS run never closed the app and never copied anything to the server — it failed in the safe direction, before the rsync. Do not assume the floor is serving, though: if an EARLIER deploy left the app closed it is STILL closed. Check for storage/framework/down on the server before concluding anything. Usual causes for this step failing: the PHP binary path is pinned to /opt/alt/php84/usr/bin/php and a host PHP upgrade can move it (see issue #167); or the app cannot boot — a half-installed vendor/ or a stale bootstrap/cache from a previous failed deploy will do it, in which case the app IS still down from that earlier run."
