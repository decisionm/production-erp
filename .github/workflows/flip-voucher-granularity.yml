name: Flip Tally voucher granularity

# Sets TALLY_VOUCHER_GRANULARITY on the LIVE .env and rebuilds the config
# caches, over the same SSH key the deploy uses. Exists because the flip is an
# .env change and .env deliberately never rides a deploy (rsync excludes it).
#
# Dry by default: without `write` it only prints the current .env line and the
# effective cached config value. Deliberately NOT a general shell — the
# granularity is a CHOICE of two literals mapped on the runner, and no
# free-text input reaches the remote command (same design as read-server-log).
#
# First use 07-Aug-2026: the owner directed the shift-granularity flip mid-day
# for a demo, overriding DEC-20260807-010's date-boundary step for that
# execution.

# Least privilege: nothing here writes to the repository. Every workflow uses
# only checkout, setup-node/php and same-run artifacts, and reaches the server
# over SSH with a deploy key — never the GITHUB_TOKEN. Without this block the
# token is repository-default, which on a push-triggered workflow that runs
# `npm ci` (arbitrary lockfile postinstall) is a write-capable token one
# compromised transitive dependency away from the pipeline that rsyncs to a
# live factory. Read is all any of these need.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      granularity:
        description: 'Voucher granularity to set.'
        type: choice
        default: shift
        options:
          - shift
          - batch
      write:
        description: 'Apply it. Without this the run only prints the current value.'
        type: boolean
        default: false

concurrency:
  group: flip-voucher-granularity
  cancel-in-progress: false

jobs:
  flip:
    runs-on: ubuntu-latest

    steps:
      # Inputs cross into shell ONLY via env. A `${{ }}` expression pasted
      # into script text is substituted as TEXT before bash parses the line,
      # so the value becomes code; env makes it data.
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan can exit 0 having collected nothing, so check the
          # output rather than the exit code (same trap as the deploy).
          # The host intermittently answers nothing: 10 of the last 100 runs failed
          # here, and EVERY one cleared on a re-run of the SAME commit — it is the
          # host, not the change. Retrying in-workflow removes that manual re-run.
          # It does NOT weaken the check: if all three attempts come back empty the
          # step still fails loudly, which is the state that must never deploy.
          keys=""
          for attempt in 1 2 3; do
            keys=$(ssh-keyscan -T 15 -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}") || true
            if [ -n "$keys" ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "ssh-keyscan attempt ${attempt} returned no host key; retrying in $((attempt * 10))s"
              sleep "$((attempt * 10))"
            fi
          done
          if [ -z "$keys" ]; then
            echo "::error::The host returned no SSH host key. Re-running often clears a transient failure; otherwise check hPanel → Advanced → SSH Access and whether brute-force protection has banned the runner."
            exit 1
          fi
          printf '%s\n' "$keys" >> ~/.ssh/known_hosts

      - name: Flip (or dry-run)
        env:
          GRANULARITY_RAW: ${{ inputs.granularity }}
          WRITE_RAW: ${{ inputs.write }}
        run: |
          set -o pipefail
          # The keyword → value mapping, a shell case on the RUNNER so the only
          # strings that can reach the server are the two literals below.
          case "$GRANULARITY_RAW" in
            batch) VALUE='batch' ;;
            *)     VALUE='shift' ;;
          esac

          PHP='\$(bash scripts/pick-php.sh 2>/dev/null || echo /opt/alt/php84/usr/bin/php)'

          if [ "$WRITE_RAW" = "true" ]; then
            REMOTE="cp .env .env.bak-granularity-flip \
              && if grep -q '^TALLY_VOUCHER_GRANULARITY=' .env; then \
                   sed -i 's/^TALLY_VOUCHER_GRANULARITY=.*/TALLY_VOUCHER_GRANULARITY=$VALUE/' .env; \
                 else \
                   printf '\nTALLY_VOUCHER_GRANULARITY=$VALUE\n' >> .env; \
                 fi \
              && $PHP artisan optimize:clear \
              && $PHP artisan config:cache \
              && $PHP artisan route:cache \
              && $PHP artisan view:cache \
              && echo '--- effective config ---' \
              && $PHP artisan config:show tally-sync.voucher_granularity"
          else
            REMOTE="echo '--- .env line (dry run, nothing written) ---' \
              && (grep '^TALLY_VOUCHER_GRANULARITY=' .env || echo 'TALLY_VOUCHER_GRANULARITY absent (default: shift)') \
              && echo '--- effective config ---' \
              && $PHP artisan config:show tally-sync.voucher_granularity"
          fi

          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}/backend' && $REMOTE" \
            2>&1 | tee flip-output.txt

      - name: Summarise
        if: always()
        env:
          GRANULARITY_RAW: ${{ inputs.granularity }}
          WRITE_RAW: ${{ inputs.write }}
        run: |
          # Decided in shell rather than by an inline expression ternary, so
          # no expression RESULT is pasted into script text either. (The
          # literal expression syntax is deliberately not written here: inside
          # a run: block it is script, and the runner would try to evaluate it.)
          if [ "$WRITE_RAW" = "true" ]; then MODE=WRITE; else MODE='dry run'; fi
          {
            echo "### Voucher granularity — $MODE ($GRANULARITY_RAW)"
            echo
            echo '```'
            cat flip-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
