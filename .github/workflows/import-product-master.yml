name: Import product master

# Runs the factory product-master import ON THE SERVER, over the same SSH key
# the deploy uses.
#
# Why this exists: the import is deliberately NOT part of the deploy — it
# writes master data, so it must be a considered act rather than a side effect
# of pushing code. But the only other way to run it was an interactive SSH
# session, which needs a password nobody should be typing into a prompt (and
# repeated failed attempts trip the host's brute-force protection, which has
# already broken one deploy). Actions already holds a working key, so this
# reuses the credential that demonstrably works and leaves a run log of who
# imported what and when.
#
# Manual only — never on push. Defaults to a DRY RUN.

# Least privilege: nothing here writes to the repository. Every workflow uses
# only checkout, setup-node/php and same-run artifacts, and reaches the server
# over SSH with a deploy key — never the GITHUB_TOKEN. Without this block the
# token is repository-default, which on a push-triggered workflow that runs
# `npm ci` (arbitrary lockfile postinstall) is a write-capable token one
# compromised transitive dependency away from the pipeline that rsyncs to a
# live factory. Read is all any of these need.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      write:
        description: 'Actually write. Leave false for a dry run that changes nothing.'
        type: boolean
        default: false
      exact_only:
        description: 'Skip any row that does not resolve to exactly one Tally item, or that carries an ambiguity. Keep true for a live instance.'
        type: boolean
        default: true
      diagnose:
        description: 'Explain why product names did not match, with the nearest catalogue entries. Writes nothing and ignores the other options.'
        type: boolean
        default: false
      local_fixtures:
        description: 'DEMO INSTANCES ONLY — create a clearly-marked "LOCAL-" item for every product the catalogue does not carry, so the floor can be rehearsed before Tally names are reconciled. Refused outright when APP_ENV=production.'
        type: boolean
        default: false

concurrency:
  group: import-product-master
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      # Inputs cross into shell ONLY via env. A `${{ }}` expression pasted
      # into script text is substituted as TEXT before bash parses the line,
      # so the value becomes code; env makes it data.
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Same diagnostics as the deploy workflow: ssh-keyscan can exit 0
          # having collected nothing, so check the output rather than the code.
          # The host intermittently answers nothing: 10 of the last 100 runs failed
          # here, and EVERY one cleared on a re-run of the SAME commit — it is the
          # host, not the change. Retrying in-workflow removes that manual re-run.
          # It does NOT weaken the check: if all three attempts come back empty the
          # step still fails loudly, which is the state that must never deploy.
          keys=""
          for attempt in 1 2 3; do
            keys=$(ssh-keyscan -T 15 -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}") || true
            if [ -n "$keys" ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "ssh-keyscan attempt ${attempt} returned no host key; retrying in $((attempt * 10))s"
              sleep "$((attempt * 10))"
            fi
          done
          if [ -z "$keys" ]; then
            echo "::error::The host returned no SSH host key. Check hPanel → Advanced → SSH Access (it can be off or IP-restricted) and whether brute-force protection has banned the runner. Re-running this workflow often clears a transient failure."
            exit 1
          fi
          printf '%s\n' "$keys" >> ~/.ssh/known_hosts

      - name: Report what is about to run
        env:
          DIAGNOSE_RAW: ${{ inputs.diagnose }}
          EXACT_ONLY_RAW: ${{ inputs.exact_only }}
          LOCAL_FIXTURES_RAW: ${{ inputs.local_fixtures }}
          WRITE_RAW: ${{ inputs.write }}
        run: |
          if [ "$DIAGNOSE_RAW" = "true" ]; then
            echo "Diagnosing name matching — nothing will be written."
          elif [ "$WRITE_RAW" = "true" ]; then
            echo "::warning::WRITING product standards to the live database (exact_only=$EXACT_ONLY_RAW)."
            if [ "$LOCAL_FIXTURES_RAW" = "true" ]; then
              echo "::warning::AND fabricating LOCAL- items for every unmatched product. Demo instances only. The command refuses this when APP_ENV=production."
            fi
          else
            echo "Dry run — nothing will be written."
          fi

      - name: Run the import
        env:
          DIAGNOSE_RAW: ${{ inputs.diagnose }}
          EXACT_ONLY_RAW: ${{ inputs.exact_only }}
          LOCAL_FIXTURES_RAW: ${{ inputs.local_fixtures }}
          WRITE_RAW: ${{ inputs.write }}
        run: |
          set -o pipefail
          FLAGS=""
          # diagnose is read-only and self-contained: it must never be combined
          # with --write, so it wins outright rather than adding to the flags.
          if [ "$DIAGNOSE_RAW" = "true" ]; then
            FLAGS="--diagnose"
          else
            [ "$WRITE_RAW" = "true" ] && FLAGS="$FLAGS --write"
            [ "$EXACT_ONLY_RAW" = "true" ] && FLAGS="$FLAGS --exact-only"
            # Passed through, never forced. The command's own APP_ENV=production
            # guard is the real protection and is deliberately left intact —
            # this only stops the flag being unreachable on a demo box.
            [ "$LOCAL_FIXTURES_RAW" = "true" ] && FLAGS="$FLAGS --local-fixtures"
          fi

          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}/backend' && \$(bash scripts/pick-php.sh 2>/dev/null || echo /opt/alt/php84/usr/bin/php) artisan production:import-product-master $FLAGS" \
            2>&1 | tee import-output.txt

      - name: Summarise
        if: always()
        env:
          EXACT_ONLY_RAW: ${{ inputs.exact_only }}
          WRITE_RAW: ${{ inputs.write }}
        run: |
          {
            echo "### Product master import"
            echo
            echo "write: \`$WRITE_RAW\` · exact_only: \`$EXACT_ONLY_RAW\`"
            echo
            echo '```'
            cat import-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
