name: Map a colour to its masterbatch

# Says which masterbatch a bottle colour uses, once, as data.
#
# Their masters hold more than one colourant for several colours — two ambers,
# four whites, two blacks, two greens, two yellows — and the completion screen
# deliberately refuses to choose between them: a wrong pre-selection books the
# wrong material and looks like somebody checked it. The cost is that the floor
# answers the same question on every batch.
#
# One row of this map ends it for a colour. Dry by default; it MERGES, so
# answering white next month cannot drop the answer for amber.
#
# Answered so far (owner, 06-Aug, and confirmed against their own 38 Tally Stock
# Journals): Amber -> "Master Batch Amber".

# Least privilege: nothing here writes to the repository. Every workflow uses
# only checkout, setup-node/php and same-run artifacts, and reaches the server
# over SSH with a deploy key — never the GITHUB_TOKEN. Without this block the
# token is repository-default, which on a push-triggered workflow that runs
# `npm ci` (arbitrary lockfile postinstall) is a write-capable token one
# compromised transitive dependency away from the pipeline that rsyncs to a
# live factory. Read is all any of these need.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      colour:
        description: 'The colour exactly as the item master spells it, e.g. Amber'
        type: string
        required: true
      item:
        description: 'The masterbatch item name exactly as Tally spells it, e.g. Master Batch Amber'
        type: string
        required: false
      forget:
        description: 'Set to the colour name to REMOVE it from the map instead'
        type: string
        required: false
      write:
        description: 'Actually write. Leave false for a dry run that changes nothing.'
        type: boolean
        default: false

concurrency:
  group: map-masterbatch-colour
  cancel-in-progress: false

jobs:
  map:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The host intermittently answers nothing: 10 of the last 100 runs failed
          # here, and EVERY one cleared on a re-run of the SAME commit — it is the
          # host, not the change. Retrying in-workflow removes that manual re-run.
          # It does NOT weaken the check: if all three attempts come back empty the
          # step still fails loudly, which is the state that must never deploy.
          keys=""
          for attempt in 1 2 3; do
            keys=$(ssh-keyscan -T 15 -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}") || true
            if [ -n "$keys" ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "ssh-keyscan attempt ${attempt} returned no host key; retrying in $((attempt * 10))s"
              sleep "$((attempt * 10))"
            fi
          done
          if [ -z "$keys" ]; then
            echo "::error::The host returned no SSH host key. Check hPanel → Advanced → SSH Access, and whether brute-force protection has banned the runner. Re-running often clears a transient failure."
            exit 1
          fi
          printf '%s\n' "$keys" >> ~/.ssh/known_hosts

      # Inputs cross into shell ONLY via env. A `${{ }}` expression pasted into
      # script text is substituted as TEXT before bash parses the line, so the
      # value becomes code; env makes it data. Mirrors dedupe-configurations.yml.
      - name: Report what is about to run
        env:
          WRITE_RAW: ${{ inputs.write }}
        run: |
          if [ "$WRITE_RAW" = "true" ]; then
            echo "::warning::WRITING the masterbatch colour map on the live database."
          else
            echo "Dry run — nothing will be written."
          fi

      - name: Run it
        env:
          WRITE_RAW: ${{ inputs.write }}
          COLOUR_RAW: ${{ inputs.colour }}
          ITEM_RAW: ${{ inputs.item }}
          FORGET_RAW: ${{ inputs.forget }}
        run: |
          set -o pipefail

          # These values are single-quoted into a command string the REMOTE
          # shell re-parses, so a quote character would break out of that
          # quoting. Validate with a positive allow-list, and REFUSE rather
          # than strip: a silently altered colour name maps the wrong
          # masterbatch on the live database, which is worse than a failed
          # run. Spaces, dots and hyphens stay legal — real Tally item names
          # carry all three ("B.450 Ml Round Pet Bottle Amber 18gms - 520 Nos").
          assert_safe() {
            if [ -z "$2" ]; then return 0; fi
            case "$2" in
              -*)
                echo "::error::$1 may not start with '-' — it would be read as a flag."
                exit 1
                ;;
            esac
            if [ "$(printf '%s' "$2" | tr -cd 'A-Za-z0-9 ._,()/-')" != "$2" ]; then
              echo "::error::$1 contains a character outside the allow-list (letters, digits, space and . _ , ( ) / -). Refusing rather than guessing what was meant."
              exit 1
            fi
          }
          assert_safe colour "$COLOUR_RAW"
          assert_safe item   "$ITEM_RAW"
          assert_safe forget "$FORGET_RAW"

          FLAGS="--colour='$COLOUR_RAW'"
          [ -n "$ITEM_RAW" ] && FLAGS="$FLAGS --item='$ITEM_RAW'"
          [ -n "$FORGET_RAW" ] && FLAGS="$FLAGS --forget='$FORGET_RAW'"
          [ "$WRITE_RAW" = "true" ] && FLAGS="$FLAGS --write"

          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}/backend' && \$(bash scripts/pick-php.sh 2>/dev/null || echo /opt/alt/php84/usr/bin/php) artisan production:map-masterbatch-colour $FLAGS" \
            2>&1 | tee output.txt

      - name: Summarise
        if: always()
        env:
          WRITE_RAW: ${{ inputs.write }}
          COLOUR_RAW: ${{ inputs.colour }}
          ITEM_RAW: ${{ inputs.item }}
        run: |
          {
            echo '### Map a colour to its masterbatch'
            echo ''
            echo "write: \`$WRITE_RAW\`  ·  colour: \`$COLOUR_RAW\`  ·  item: \`$ITEM_RAW\`"
            echo ''
            echo '```'
            tail -c 60000 output.txt 2>/dev/null || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
