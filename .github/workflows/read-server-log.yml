name: Read server log

# Tails the LIVE Laravel log over the same SSH key the deploy uses.
#
# Why this exists: when the floor reports "the screen is broken", the only
# authoritative account of what the server actually did is
# storage/logs/laravel.log. Without this, diagnosing meant guessing from the
# frontend and re-deploying speculative fixes — which is how a go-live morning
# gets spent. Reading the log is strictly READ-ONLY: no artisan command, no
# writes, nothing that can change state.
#
# Deliberately NOT a general shell. The command is fixed (tail + optional
# grep), so this workflow cannot be repurposed into arbitrary remote
# execution by editing an input.
#
# `log` is a CHOICE, never a path. The obvious way to let this read a second
# file would be a free-text filename input — and that is precisely what would
# turn a read-only log tail into "read any file on the server the deploy user
# can reach". The two real logs are named here instead, and the remote command
# maps a fixed keyword to a fixed location. An input that is not one of the two
# keywords cannot be submitted at all.

on:
  workflow_dispatch:
    inputs:
      log:
        description: 'Which log to read.'
        type: choice
        default: laravel
        options:
          - laravel
          - tally-agent
      lines:
        description: 'How many lines from the end of the log.'
        type: string
        default: '250'
      pattern:
        description: 'Optional case-insensitive filter (e.g. an exception class, a route, an entry id). Leave blank for the raw tail.'
        type: string
        default: ''

concurrency:
  group: read-server-log
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan can exit 0 having collected nothing, so check the
          # output rather than the exit code (same trap as the deploy).
          keys=$(ssh-keyscan -T 15 -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}") || true
          if [ -z "$keys" ]; then
            echo "::error::The host returned no SSH host key. Re-running often clears a transient failure; otherwise check hPanel → Advanced → SSH Access and whether brute-force protection has banned the runner."
            exit 1
          fi
          printf '%s\n' "$keys" >> ~/.ssh/known_hosts

      # Inputs cross into shell ONLY via env. A `${{ }}` expression pasted into
      # script text is substituted as TEXT before bash parses the line — which
      # is why the old `tr -d` here protected nothing: tr ran on a value that
      # had already become code.
      - name: Tail the log
        env:
          LOG_RAW: ${{ inputs.log }}
          LINES_RAW: ${{ inputs.lines }}
          PATTERN_RAW: ${{ inputs.pattern }}
        run: |
          set -o pipefail

          # REFUSE rather than strip. A silently altered filter returns results
          # for a search nobody typed, which during an incident is worse than
          # an error.
          if [ -z "$LINES_RAW" ]; then
            LINES=250
          elif [ "$(printf '%s' "$LINES_RAW" | tr -cd '0-9')" != "$LINES_RAW" ]; then
            echo "::error::lines must be digits only; got a value containing something else."
            exit 1
          else
            LINES=$LINES_RAW
          fi

          # The pattern becomes a single-quoted argument to a REMOTE grep.
          # Inside single quotes the only character the shell treats specially
          # is the single quote itself, so refusing it is what makes the
          # quoting sound. Backslash IS allowed on purpose: the documented use
          # is searching for a PHP exception class such as
          # Illuminate\Database\QueryException.
          PATTERN=$PATTERN_RAW
          if [ -n "$PATTERN" ] && [ "$(printf '%s' "$PATTERN" | tr -cd 'A-Za-z0-9 ._,:/@#()[]\\+-')" != "$PATTERN" ]; then
            echo "::error::pattern contains a character outside the allow-list (letters, digits, space and . _ , : / @ # ( ) [ ] \\ + -). Refusing rather than searching for something other than what was typed."
            exit 1
          fi

          # The keyword → file mapping. Written as a shell case on the RUNNER
          # (not interpolated into the remote command) so the only strings that
          # can ever reach the server are the two literals below.
          #
          # The agent log is written by Laravel's `daily` driver, so it is
          # tally-agent-YYYY-MM-DD.log, not tally-agent.log — the newest
          # matching file is picked on the server, which is also what makes
          # "today's log" the default answer without passing a date.
          case "$LOG_RAW" in
            tally-agent)
              TARGET='"$(ls -1t storage/logs/tally-agent-*.log 2>/dev/null | head -n 1)"'
              ;;
            *)
              TARGET='storage/logs/laravel.log'
              ;;
          esac

          if [ -n "$PATTERN" ]; then
            REMOTE="tail -n 4000 $TARGET | grep -i -- '$PATTERN' | tail -n $LINES"
          else
            REMOTE="tail -n $LINES $TARGET"
          fi

          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}/backend' && $REMOTE" \
            2>&1 | tee log-output.txt

      - name: Summarise
        if: always()
        env:
          LOG_RAW: ${{ inputs.log }}
          LINES_RAW: ${{ inputs.lines }}
          PATTERN_RAW: ${{ inputs.pattern }}
        run: |
          {
            echo "### Live server log — $LOG_RAW"
            echo
            echo "log: \`$LOG_RAW\` · lines: \`$LINES_RAW\` · pattern: \`$PATTERN_RAW\`"
            echo
            echo '```'
            cat log-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
