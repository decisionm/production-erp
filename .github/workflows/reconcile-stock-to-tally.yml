name: Match stock to Tally

# Makes the ERP's stock balances EQUAL a Tally stock summary, item by item and
# godown by godown. Dry by default: without write=true it prints every balance
# that would move, in both directions, and changes nothing.
#
# THIS IS NOT THE OPENING-STOCK APPLY. That one receipts Tally's closing balance
# — it ADDS, and a later snapshot applied that way is twice the stock with no
# error anywhere. This one moves only the DIFFERENCE, so it is safe to run again
# on every fresh snapshot, which is the only way "sync the live stock" can be a
# monthly habit rather than a one-off.
#
# Take the stock summary from the Windows sync agent first; this reads the most
# recent one unless a snapshot id is given.

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Snapshot id. Leave blank for the most recent one.'
        type: string
        required: false
      write:
        description: 'Actually write. Leave false for a dry run that changes nothing.'
        type: boolean
        default: false

concurrency:
  group: reconcile-stock-to-tally
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          keys=$(ssh-keyscan -T 15 -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}") || true
          if [ -z "$keys" ]; then
            echo "::error::The host returned no SSH host key. Check hPanel → Advanced → SSH Access, and whether brute-force protection has banned the runner. Re-running often clears a transient failure."
            exit 1
          fi
          printf '%s\n' "$keys" >> ~/.ssh/known_hosts

      # Inputs cross into shell ONLY via env. A `${{ }}` expression pasted into
      # script text is substituted as TEXT before bash parses the line, so the
      # value becomes code; env makes it data.
      - name: Report what is about to run
        env:
          WRITE_RAW: ${{ inputs.write }}
        run: |
          if [ "$WRITE_RAW" = "true" ]; then
            echo "::warning::MATCHING live stock balances to Tally. Movements are written to the stock ledger."
          else
            echo "Dry run — nothing will be written."
          fi

      - name: Run it
        env:
          WRITE_RAW: ${{ inputs.write }}
          SNAPSHOT_RAW: ${{ inputs.snapshot }}
        run: |
          set -o pipefail

          # A snapshot id is an identifier, so the allow-list is tight. It was
          # also the only free-text value here reaching ssh UNQUOTED, which is
          # why it is both validated and quoted below. Refuse rather than
          # strip: a truncated id would reconcile against the wrong snapshot.
          if [ -n "$SNAPSHOT_RAW" ]; then
            case "$SNAPSHOT_RAW" in
              -*)
                echo "::error::snapshot may not start with '-' — it would be read as a flag."
                exit 1
                ;;
            esac
            if [ "$(printf '%s' "$SNAPSHOT_RAW" | tr -cd 'A-Za-z0-9._-')" != "$SNAPSHOT_RAW" ]; then
              echo "::error::snapshot must be letters, digits and . _ - only. Refusing rather than guessing what was meant."
              exit 1
            fi
          fi

          FLAGS=""
          [ -n "$SNAPSHOT_RAW" ] && FLAGS="$FLAGS --snapshot='$SNAPSHOT_RAW'"
          [ "$WRITE_RAW" = "true" ] && FLAGS="$FLAGS --write"

          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}/backend' && /opt/alt/php84/usr/bin/php artisan tally:reconcile-stock $FLAGS" \
            2>&1 | tee output.txt

      - name: Summarise
        if: always()
        env:
          WRITE_RAW: ${{ inputs.write }}
          SNAPSHOT_RAW: ${{ inputs.snapshot }}
        run: |
          {
            echo '### Match stock to Tally'
            echo ''
            echo "write: \`$WRITE_RAW\`  ·  snapshot: \`${SNAPSHOT_RAW:-latest}\`"
            echo ''
            echo '```'
            tail -c 60000 output.txt 2>/dev/null || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
