name: Remove demo employees

# Soft-deletes the seven demo-seeder employees (EMP-001..EMP-007) from the
# live database, ON THE SERVER, over the same SSH key the deploy uses.
#
# Why this exists: BottleManufacturingDemoSeeder creates seven fabricated
# people. It is not in the deploy's seeder list and never has been — but a
# commented-'optional' line in DEPLOY.md's one-time server bootstrap offered
# it, and a read of the live instance on 2026-08-12 found all seven present.
# They are fake staff sitting in a real factory's HRMS.
#
# WHY IT IS NOT A MIGRATION. Deleting people is not a schema change and must
# not happen as a side effect of a deploy. A person runs this, reads which
# rows it would touch, and only then runs it again with write=true.
#
# WHAT IT REFUSES TO DO. A row must match employee_code AND name AND
# date_of_joining before it is even a candidate — these fixtures carry no
# synthetic marker, and EMP-001 is a perfectly plausible code for a real first
# employee. Anything matching only partially is reported and left alone.
# Anything referenced by real work (a batch it operated or signed, a work
# order, a CAPA, attendance, leave, payroll) is left alone and reported. It
# soft-deletes and NEVER force-deletes, because a hard delete would cascade
# real rows away and blank the signatory on real production records.
#
# Manual only — never on push. Defaults to a DRY RUN.

on:
  workflow_dispatch:
    inputs:
      write:
        description: 'Actually write. Leave false for a dry run that changes nothing.'
        type: boolean
        default: false

concurrency:
  group: remove-demo-employees
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Same diagnostics as the deploy workflow: ssh-keyscan can exit 0
          # having collected nothing, so check the output rather than the code.
          # The host intermittently answers nothing: 10 of the last 100 runs failed
          # here, and EVERY one cleared on a re-run of the SAME commit — it is the
          # host, not the change. Retrying in-workflow removes that manual re-run.
          # It does NOT weaken the check: if all three attempts come back empty the
          # step still fails loudly, which is the state that must never deploy.
          keys=""
          for attempt in 1 2 3; do
            keys=$(ssh-keyscan -T 15 -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}") || true
            if [ -n "$keys" ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "ssh-keyscan attempt ${attempt} returned no host key; retrying in $((attempt * 10))s"
              sleep "$((attempt * 10))"
            fi
          done
          if [ -z "$keys" ]; then
            echo "::error::The host returned no SSH host key. Check hPanel → Advanced → SSH Access (it can be off or IP-restricted) and whether brute-force protection has banned the runner. Wait several minutes before re-running — retrying inside the ban window extends it."
            exit 1
          fi
          printf '%s\n' "$keys" >> ~/.ssh/known_hosts

      # Inputs cross into shell ONLY via env: — a `${{ }}` expression pasted
      # into a run: body is substituted as text before bash parses it, which
      # is the workflow-injection shape. `write` is declared boolean, but
      # whether GitHub enforces the type for API-dispatched runs is not
      # something this repo can verify, and this is the workflow that deletes
      # people. So it is treated as untrusted text and compared, never
      # interpolated into a command.
      - name: Report what is about to run
        env:
          WRITE_RAW: ${{ inputs.write }}
        run: |
          set -euo pipefail
          if [ "$WRITE_RAW" = "true" ]; then
            echo "::warning::SOFT-DELETING demo employees from the live database. Any fixture referenced by real work, or matching only partially, is left alone and named in the output."
          else
            echo "Dry run — nothing will be written."
          fi

      - name: Run the cleanup
        env:
          WRITE_RAW: ${{ inputs.write }}
        run: |
          set -euo pipefail
          set -o pipefail

          # The remote command is built from literals only. The input decides
          # WHICH literal, and never contributes text to the command.
          REMOTE="cd '${{ secrets.DEPLOY_PATH }}/backend' && \$(bash scripts/pick-php.sh 2>/dev/null || echo /opt/alt/php84/usr/bin/php) artisan hrms:remove-demo-employees"
          if [ "$WRITE_RAW" = "true" ]; then
            REMOTE="$REMOTE --write"
          fi

          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "$REMOTE" \
            2>&1 | tee cleanup-output.txt

      - name: Summarise
        if: always()
        env:
          WRITE_RAW: ${{ inputs.write }}
        run: |
          {
            echo "### Remove demo employees"
            echo
            echo "write: \`${WRITE_RAW}\`"
            echo
            echo '```'
            cat cleanup-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
