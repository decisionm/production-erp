name: Reset test data

# Clears the rehearsal batches from the LIVE database so a real first day starts
# from a clean floor. Runs over the same SSH key the deploy uses.
#
# DEFAULTS TO A DRY RUN. The dry run reports exactly what would go — how many
# batches, how many stock movements, and the number of every Tally voucher it is
# about to orphan — and changes nothing. Writing is a separate, deliberate act
# that requires typing the confirmation phrase below.
#
# What it never touches: products, production standards, machine configurations,
# downtime reasons, factory settings, warehouses, shifts, users, moulds, or the
# imported workbook.
#
# `since` is REFUSED unless it is a real YYYY-MM-DD date. A cutoff that cannot be
# read is not quietly dropped: dropping it turns "clear yesterday" into "clear
# everything", which is the one mistake this workflow must not be able to make.
#
# WHAT IT CANNOT DO: unsend a Tally voucher. A batch that reached Accountant
# approval has already posted into the factory's live books, and only a person
# in Tally can remove it. The command names those voucher numbers precisely so
# that work does not get forgotten.

# Least privilege: nothing here writes to the repository. Every workflow uses
# only checkout, setup-node/php and same-run artifacts, and reaches the server
# over SSH with a deploy key — never the GITHUB_TOKEN. Without this block the
# token is repository-default, which on a push-triggered workflow that runs
# `npm ci` (arbitrary lockfile postinstall) is a write-capable token one
# compromised transitive dependency away from the pipeline that rsyncs to a
# live factory. Read is all any of these need.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      write:
        description: 'Actually delete. Leave false for a dry run that changes nothing.'
        type: boolean
        default: false
      confirm:
        description: 'To delete, type exactly:  DELETE TEST DATA  (ignored on a dry run)'
        type: string
        default: ''
      since:
        description: 'Only production dates on or after this (YYYY-MM-DD). Blank = every batch.'
        type: string
        default: ''

concurrency:
  group: reset-test-data
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest

    steps:
      # Both checks read their input from `env`, never from an inline ${{ }}
      # expansion. An expansion is substituted into the script TEXT before bash
      # parses it, so a value containing shell would already have run by the time
      # any test or `tr` looked at it — no amount of sanitising downstream can
      # undo that. Through env the value is only ever data.
      - name: Refuse a write without the typed confirmation
        if: ${{ inputs.write }}
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DELETE TEST DATA" ]; then
            echo "::error::Write refused. To delete, set write=true AND type DELETE TEST DATA in the confirm box. A dry run (write=false) needs no confirmation."
            exit 1
          fi
          echo "::warning::DELETING rehearsal data from the LIVE database. Ensure a database backup exists."

      # Refused, never stripped. This box once ran through `tr -cd '0-9-'`, which
      # turned "yesterday" into the EMPTY string — and an empty since means no
      # --since flag at all, i.e. delete every batch the factory ever made, from a
      # run the operator had asked to limit to one day. A since that is not a date
      # stops the workflow here, before a single row is read.
      - name: Refuse a since that is not a date
        env:
          SINCE: ${{ inputs.since }}
        run: |
          TRIMMED="$(printf '%s' "$SINCE" | tr -d '[:space:]')"
          if [ -n "$TRIMMED" ] && ! printf '%s' "$TRIMMED" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::since must be a date in YYYY-MM-DD form (got '$SINCE'). Leave the box blank to clear every batch — this run has been refused rather than silently widened to everything."
            exit 1
          fi
          echo "SINCE=$TRIMMED" >> "$GITHUB_ENV"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan can exit 0 having collected nothing, so check the output
          # rather than the exit code (the same trap the deploy hit).
          # The host intermittently answers nothing: 10 of the last 100 runs failed
          # here, and EVERY one cleared on a re-run of the SAME commit — it is the
          # host, not the change. Retrying in-workflow removes that manual re-run.
          # It does NOT weaken the check: if all three attempts come back empty the
          # step still fails loudly, which is the state that must never deploy.
          keys=""
          for attempt in 1 2 3; do
            keys=$(ssh-keyscan -T 15 -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}") || true
            if [ -n "$keys" ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "ssh-keyscan attempt ${attempt} returned no host key; retrying in $((attempt * 10))s"
              sleep "$((attempt * 10))"
            fi
          done
          if [ -z "$keys" ]; then
            echo "::error::The host returned no SSH host key. Re-running often clears a transient failure; otherwise check hPanel → Advanced → SSH Access and whether brute-force protection has banned the runner."
            exit 1
          fi
          printf '%s\n' "$keys" >> ~/.ssh/known_hosts

      - name: Run it
        env:
          WRITE: ${{ inputs.write }}
        run: |
          set -o pipefail
          FLAGS=""
          # if-blocks, not `[ ... ] && FLAGS=...`: under bash -e a failing test at
          # the head of an AND-list is IGNORED, so the "no flag" branch used to
          # sail past unnoticed instead of stopping anything. $SINCE comes from
          # the refusal step above, already proven to be a date or empty.
          if [ "$WRITE" = "true" ]; then
            FLAGS="$FLAGS --write --force"
          fi
          if [ -n "$SINCE" ]; then
            FLAGS="$FLAGS --since=$SINCE"
          fi

          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}/backend' && \$(bash scripts/pick-php.sh 2>/dev/null || echo /opt/alt/php84/usr/bin/php) artisan production:reset-test-data $FLAGS" \
            2>&1 | tee reset-output.txt

      - name: Summarise
        if: always()
        env:
          WRITE: ${{ inputs.write }}
          SINCE_INPUT: ${{ inputs.since }}
        run: |
          # Through env, like every other read of these boxes — this step runs on
          # always(), so it sees the raw value even on the run that was refused.
          {
            echo "### Reset test data"
            echo
            echo "write: \`$WRITE\` · since: \`$SINCE_INPUT\`"
            echo
            echo '```'
            cat reset-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
