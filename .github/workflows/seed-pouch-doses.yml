name: Seed pouch and cover doses

# Sets how much each pouch and cover WEIGHS, from the figures the factory counted
# — a kilogram of each size weighed and the pieces in it counted (photo, 06-Aug).
#
# The count is the measurement. The "per pouch" column on the same sheet is
# derived from it and rounded to two decimals, which is not usable: 750x610 is 71
# pouches to the kilogram, so one is 0.0141 kg, and the sheet's 0.01 makes a
# thousand pouches read 10 kg instead of 14.08. A 29% under-count on a line that
# posts to Tally.
#
# So the count is stored and the weight derived, rounded rather than truncated —
# because a dose multiplies by every pouch in a shift and a truncation always
# errs the same way.
#
# Idempotent and non-destructive: a spec a person has already answered is left
# exactly as it is. A figure typed by the floor outranks one seeded from a
# photograph of a handwritten sheet.

on:
  workflow_dispatch:
    inputs:
      write:
        description: 'Actually write. Leave false for a dry run that changes nothing.'
        type: boolean
        default: false

concurrency:
  group: seed-pouch-doses
  cancel-in-progress: false

jobs:
  doses:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          keys=$(ssh-keyscan -T 15 -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}") || true
          if [ -z "$keys" ]; then
            echo "::error::The host returned no SSH host key. Check hPanel → Advanced → SSH Access, and whether brute-force protection has banned the runner. Re-running often clears a transient failure."
            exit 1
          fi
          printf '%s\n' "$keys" >> ~/.ssh/known_hosts

      - name: Report what is about to run
        run: |
          if [ "${{ inputs.write }}" = "true" ]; then
            echo "::warning::WRITING pouch and cover weights to the live database."
          else
            echo "Dry run — nothing will be written."
          fi

      - name: Run it
        run: |
          set -o pipefail
          FLAGS=""
          [ "${{ inputs.write }}" = "true" ] && FLAGS="$FLAGS --write"

          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}/backend' && /opt/alt/php84/usr/bin/php artisan production:seed-pouch-doses $FLAGS" \
            2>&1 | tee output.txt

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Seed pouch and cover doses"
            echo
            echo "write: \`${{ inputs.write }}\`"
            echo
            echo '```'
            cat output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
