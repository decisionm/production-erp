table: finished_cartons
module: production
label: 'Finished Cartons'
purpose: ''
columns:
  -
    name: id
    type: integer
  -
    name: shift_production_entry_id
    type: integer
    references: shift_production_entries.id
  -
    name: carton_no
    type: string
  -
    name: item_id
    type: integer
    references: items.id
  -
    name: pieces
    type: decimal
  -
    name: is_partial
    type: integer
  -
    name: status
    type: string
  -
    name: delivery_id
    type: integer
    nullable: true
    references: deliveries.id
  -
    name: created_by
    type: integer
