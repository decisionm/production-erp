table: items
module: inventory
label: Items
purpose: 'One row is one stock item: a product (finished good), a raw material such as resin or masterbatch, a packing material, a consumable or a spare. The ERP item master, mirrored 1:1 from a Tally stock item when tally_stock_item_guid is set.'
columns:
  -
    name: id
    type: integer
    meaning: 'Primary key'
  -
    name: sku
    type: string
    meaning: 'Stock-keeping code, unique; copied from the Tally name when the sync creates the item (see sku_provisional)'
  -
    name: name
    type: string
    meaning: 'Item name; the Tally wire key (STOCKITEMNAME), locked once the item is Tally-linked'
  -
    name: description
    type: string
    nullable: true
    meaning: 'Free-text description'
  -
    name: uom
    type: string
    meaning: 'Base unit of measure as free text from Tally, e.g. Kgs, Nos., PCS; kg-family units mean a weight, Nos-family units mean a count'
  -
    name: reorder_level
    type: decimal
    meaning: 'Stock level (in uom) below which reordering is flagged; 0 = not set'
  -
    name: is_active
    type: integer
    meaning: '1 = active, 0 = deactivated (still referenced by history)'
  -
    name: created_at
    type: datetime
    nullable: true
    meaning: 'When the row was created'
  -
    name: updated_at
    type: datetime
    nullable: true
    meaning: 'When the row was last updated'
  -
    name: deleted_at
    type: datetime
    nullable: true
    meaning: 'Soft-delete timestamp; null means the row is live'
  -
    name: hsn_sac_code
    type: string
    nullable: true
    meaning: 'GST HSN/SAC code'
  -
    name: tracking_type
    type: string
    meaning: 'How stock is tracked: none | batch | serial'
  -
    name: nominal_weight_grams
    type: decimal
    nullable: true
    meaning: 'Nominal weight of one piece in grams (finished goods)'
  -
    name: tally_stock_item_guid
    type: string
    nullable: true
    meaning: 'Tally stock item GUID; null for an ERP-only item'
  -
    name: tally_alter_id
    type: integer
    nullable: true
    meaning: 'Tally AlterID change counter seen at the last sync'
  -
    name: tally_synced_at
    type: datetime
    nullable: true
    meaning: 'When the item was last pulled from Tally'
  -
    name: item_group_id
    type: integer
    nullable: true
    meaning: 'Tally stock group the item belongs to (item_groups.id)'
  -
    name: nos_per_tray
    type: integer
    nullable: true
    meaning: 'Pieces per tray for tray-packed products (Nos)'
  -
    name: trays_per_box
    type: integer
    nullable: true
    meaning: 'Trays per box (carton) for tray-packed products'
  -
    name: nos_per_box
    type: integer
    nullable: true
    meaning: 'Pieces per box (carton) (Nos)'
  -
    name: colour
    type: string
    nullable: true
    meaning: 'Product colour, e.g. amber, natural'
  -
    name: standard_cycle_time
    type: decimal
    nullable: true
    meaning: 'Standard moulding cycle time (seconds per shot)'
  -
    name: standard_cavities
    type: integer
    nullable: true
    meaning: 'Standard number of mould cavities used for this product'
  -
    name: nos_per_pouch
    type: integer
    nullable: true
    meaning: 'Pieces per pouch for pouch-packed products (Nos)'
  -
    name: pouches_per_box
    type: integer
    nullable: true
    meaning: 'Pouches per box (carton) for pouch-packed products'
  -
    name: tally_company
    type: string
    nullable: true
    meaning: 'Which Tally company the master came from; null = provenance unknown (row predates the column)'
  -
    name: is_local_fixture
    type: integer
    meaning: '1 = local-only fixture item that does not exist in Tally; its batches never post to Tally'
  -
    name: created_by
    type: integer
    nullable: true
    meaning: 'User who created the row (users.id)'
    references: users.id
  -
    name: updated_by
    type: integer
    nullable: true
    meaning: 'User who last updated the row (users.id)'
    references: users.id
  -
    name: sku_provisional
    type: integer
    meaning: '1 = SKU was seeded from the Tally name and not yet chosen by a person'
  -
    name: is_production_input
    type: integer
    meaning: '1 = may be requested from the store and issued to production'
  -
    name: category
    type: string
    nullable: true
    meaning: 'What kind of item: raw_material | packing_material | finished_good | work_in_progress | consumable | spare_tooling | other; null = not yet classified'
  -
    name: display_name
    type: string
    nullable: true
    meaning: 'Person-facing name shown on screens; null falls back to name'
  -
    name: variant_of_item_id
    type: integer
    nullable: true
    meaning: 'Base product (items.id) when this item is a pack variant of it; null on a base product'
    references: items.id
  -
    name: variant_label
    type: string
    nullable: true
    meaning: 'What makes the variant different, in factory words, e.g. "840/box pouch"'
joins:
  - 'items.variant_of_item_id = items.id'
  - 'items.created_by = users.id'
  - 'items.updated_by = users.id'
  - 'items.item_group_id = item_groups.id'
keywords:
  - sku
  - product
  - material
  - resin
  - masterbatch
  - carton
  - 'item master'
  - 'finished good'
questions:
  - 'How many active items are finished goods?'
  - 'Which items have no Tally mapping?'
  - 'Which items can be issued to production?'
