table: ledger_groups
module: finance
label: 'Tally Ledger Groups'
purpose: 'One Tally ledger group (the accounting hierarchy, e.g. Current Assets, Sundry Creditors, Sundry Debtors) mirrored read-only from Tally by the masters pull. Groups nest through parent_id; ledgers hang off them via ledgers.ledger_group_id.'
columns:
  -
    name: id
    type: integer
    meaning: 'Primary key'
  -
    name: tally_guid
    type: string
    nullable: true
    meaning: 'Tally GUID of the group; unique'
  -
    name: name
    type: string
    meaning: 'Group name as in Tally (e.g. Sundry Creditors)'
  -
    name: tally_parent_name
    type: string
    nullable: true
    meaning: 'Name of the parent group as Tally reported it; used to re-resolve parent_id on each pull'
  -
    name: parent_id
    type: integer
    nullable: true
    meaning: 'The parent group (ledger_groups); NULL for a top-level group'
    references: ledger_groups.id
  -
    name: created_at
    type: datetime
    nullable: true
    meaning: 'When the group was first mirrored'
  -
    name: updated_at
    type: datetime
    nullable: true
    meaning: 'When the row was last re-pulled'
  -
    name: deleted_at
    type: datetime
    nullable: true
    meaning: 'Soft-delete timestamp; NULL means the group is live'
joins:
  - 'ledger_groups.parent_id = ledger_groups.id'
keywords:
  - 'ledger group'
  - 'tally group'
  - 'sundry creditors'
  - 'sundry debtors'
  - 'account group'
questions:
  - 'Which ledger groups sit under Current Liabilities?'
  - 'How many ledgers are in the Sundry Creditors group?'
