table: material_lots
module: inventory
label: 'Material Lots'
purpose: 'One row is one supplier lot of a material received on a GRN line (or an opening-stock lot with no GRN behind it): bag count, weights, and the receipt rate per kg with its provenance.'
columns:
  -
    name: id
    type: integer
    meaning: 'Primary key'
  -
    name: grn_id
    type: integer
    nullable: true
    meaning: 'Goods receipt note the lot arrived on (goods_receipt_notes.id); null for an opening-stock lot'
    references: goods_receipt_notes.id
  -
    name: item_id
    type: integer
    meaning: 'Material received (items.id)'
    references: items.id
  -
    name: supplier_lot_no
    type: string
    nullable: true
    meaning: "The supplier's own lot or batch number"
  -
    name: received_date
    type: date
    meaning: 'Date the lot was received; FIFO picks oldest first'
  -
    name: bag_count
    type: integer
    meaning: 'Number of bags in the lot'
  -
    name: bag_weight_kg
    type: decimal
    nullable: true
    meaning: 'Nominal weight of one bag (kg); actual per-bag weights are on material_bags.original_kg'
  -
    name: total_received_kg
    type: decimal
    meaning: 'Total weight received (kg)'
  -
    name: notes
    type: string
    nullable: true
    meaning: 'Free-text note'
  -
    name: created_by
    type: integer
    nullable: true
    meaning: 'User who created the row (users.id)'
    references: users.id
  -
    name: created_at
    type: datetime
    nullable: true
    meaning: 'When the row was created'
  -
    name: updated_at
    type: datetime
    nullable: true
    meaning: 'When the row was last updated'
  -
    name: goods_receipt_note_line_id
    type: integer
    nullable: true
    meaning: 'GRN line the lot came from (goods_receipt_note_lines.id)'
    references: goods_receipt_note_lines.id
  -
    name: receipt_rate_per_kg
    type: decimal
    nullable: true
    meaning: 'Purchase rate per kg (INR) at receipt; analytic only, not valuation'
    sensitive: rates
  -
    name: rate_source
    type: string
    nullable: true
    meaning: 'Where receipt_rate_per_kg came from: grn | po | manual; null = rate unknown (opening stock), never zero'
joins:
  - 'material_lots.goods_receipt_note_line_id = goods_receipt_note_lines.id'
  - 'material_lots.grn_id = goods_receipt_notes.id'
  - 'material_lots.item_id = items.id'
  - 'material_lots.created_by = users.id'
  - 'material_bags.material_lot_id = material_lots.id'
  - 'material_cost_versions.material_lot_id = material_lots.id'
keywords:
  - lot
  - 'supplier lot'
  - 'resin lot'
  - 'received lot'
  - 'grn lot'
  - 'batch of resin'
questions:
  - 'Which lots were received this month?'
  - 'How many bags did each lot arrive with?'
