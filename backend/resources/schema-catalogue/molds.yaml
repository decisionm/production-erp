table: molds
module: production
label: Moulds
purpose: 'One row is a physical mould (die/tool) the factory owns, with its code, cavity count and whether it is active, under repair or retired. Which mould is on which machine is tracked through mold_change_logs, not here.'
columns:
  -
    name: id
    type: integer
    meaning: 'Primary key'
  -
    name: code
    type: string
    meaning: 'Unique mould code'
  -
    name: name
    type: string
    meaning: 'Mould name, usually describing the product it makes (e.g. 100 ml round 12.9 g)'
  -
    name: cavity_count
    type: integer
    nullable: true
    meaning: 'Number of cavities: bottles produced per shot / cycle'
  -
    name: status
    type: string
    meaning: 'Mould condition: active, under_repair, retired'
  -
    name: notes
    type: string
    nullable: true
    meaning: 'Free-text notes about the mould'
  -
    name: created_at
    type: datetime
    nullable: true
    meaning: 'When the row was created'
  -
    name: updated_at
    type: datetime
    nullable: true
    meaning: 'When the row was last changed'
  -
    name: deleted_at
    type: datetime
    nullable: true
    meaning: 'Soft-delete timestamp; NULL means not deleted'
  -
    name: created_by
    type: integer
    nullable: true
    meaning: 'User who created the master row; NULL if it arrived by import -> users'
    references: users.id
  -
    name: updated_by
    type: integer
    nullable: true
    meaning: 'User who last edited the master row -> users'
    references: users.id
joins:
  - 'molds.updated_by = users.id'
  - 'molds.created_by = users.id'
keywords:
  - mould
  - mold
  - die
  - cavity
  - tool
  - 'under repair'
questions:
  - 'Which moulds are under repair right now?'
  - 'How many cavities does each active mould have?'
