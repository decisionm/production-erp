table: non_conformance_reports
module: quality
label: 'Non Conformance Reports'
purpose: ''
columns:
  -
    name: id
    type: integer
  -
    name: incoming_inspection_id
    type: integer
    nullable: true
    references: incoming_inspections.id
  -
    name: item_id
    type: integer
    references: items.id
  -
    name: description
    type: string
  -
    name: severity
    type: string
  -
    name: status
    type: string
  -
    name: quantity_affected
    type: decimal
    nullable: true
  -
    name: raised_by
    type: integer
    nullable: true
    references: users.id
  -
    name: raised_date
    type: date
  -
    name: resolution
    type: string
    nullable: true
  -
    name: closed_date
    type: date
    nullable: true
  -
    name: created_at
    type: datetime
    nullable: true
  -
    name: updated_at
    type: datetime
    nullable: true
joins:
  - 'non_conformance_reports.raised_by = users.id'
  - 'non_conformance_reports.item_id = items.id'
  - 'non_conformance_reports.incoming_inspection_id = incoming_inspections.id'
keywords: {}
questions: {}
