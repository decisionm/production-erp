table: production_downtime_events
module: production
label: 'Production Downtime Events'
purpose: "One row is one downtime occurrence on one machine on one production date: how many minutes, why (power cut, mould change, ...), whether it was planned and whether it was known before the batch started. Planned events can exist before a batch and are attached to it at Start; they net out of the batch's running hours."
columns:
  -
    name: id
    type: integer
    meaning: 'Primary key'
  -
    name: shift_production_entry_id
    type: integer
    nullable: true
    meaning: 'The batch the downtime is attached to -> shift_production_entries; null until a batch starts on that machine/date'
    references: shift_production_entries.id
  -
    name: work_center_id
    type: integer
    meaning: 'The machine that was down -> work_centers'
    references: work_centers.id
  -
    name: downtime_reason_id
    type: integer
    meaning: 'Why the machine was down -> downtime_reasons'
    references: downtime_reasons.id
  -
    name: production_date
    type: date
    meaning: 'Production date the downtime fell on'
  -
    name: minutes
    type: decimal
    meaning: 'Duration in minutes'
  -
    name: is_planned
    type: integer
    meaning: '1 = planned downtime, 0 = unplanned'
  -
    name: known_before_start
    type: integer
    meaning: '1 = entered before the batch started (foreseeable), 0 = logged mid-shift or at completion'
  -
    name: note
    type: string
    nullable: true
    meaning: 'Free-text note'
  -
    name: recorded_by
    type: integer
    nullable: true
    meaning: 'User who logged the downtime -> users'
    references: users.id
  -
    name: created_at
    type: datetime
    nullable: true
    meaning: 'When the event was logged'
  -
    name: updated_at
    type: datetime
    nullable: true
    meaning: 'When the row was last changed'
joins:
  - 'production_downtime_events.recorded_by = users.id'
  - 'production_downtime_events.downtime_reason_id = downtime_reasons.id'
  - 'production_downtime_events.work_center_id = work_centers.id'
  - 'production_downtime_events.shift_production_entry_id = shift_production_entries.id'
keywords:
  - downtime
  - 'machine stopped'
  - breakdown
  - 'power cut'
  - 'mould change'
  - idle
questions:
  - 'How many minutes of downtime did each machine have last week, by reason?'
  - 'Which batches lost more than an hour to unplanned downtime?'
