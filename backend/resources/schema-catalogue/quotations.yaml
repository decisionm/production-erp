table: quotations
module: sales
label: Quotations
purpose: ''
columns:
  -
    name: id
    type: integer
  -
    name: opportunity_id
    type: integer
    references: opportunities.id
  -
    name: customer_id
    type: integer
    references: customers.id
  -
    name: status
    type: string
  -
    name: quotation_date
    type: date
  -
    name: valid_until
    type: date
    nullable: true
  -
    name: notes
    type: string
    nullable: true
  -
    name: created_by
    type: integer
    nullable: true
    references: users.id
  -
    name: created_at
    type: datetime
    nullable: true
  -
    name: updated_at
    type: datetime
    nullable: true
joins:
  - 'quotations.created_by = users.id'
  - 'quotations.customer_id = customers.id'
  - 'quotations.opportunity_id = opportunities.id'
keywords: {}
questions: {}
