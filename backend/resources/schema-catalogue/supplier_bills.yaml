table: supplier_bills
module: procurement
label: 'Supplier Bills'
purpose: 'One supplier invoice (purchase bill) recorded in the ERP as printed on the paper: its number, date and figures. It is a record of what the factory owes for an arrival, not a Tally Purchase voucher; its item lines are in supplier_bill_lines.'
columns:
  -
    name: id
    type: integer
    meaning: 'Primary key'
  -
    name: vendor_id
    type: integer
    meaning: 'The supplier who issued the bill (vendors)'
    references: vendors.id
  -
    name: purchase_order_id
    type: integer
    nullable: true
    meaning: 'The purchase order the bill is against, if any (purchase_orders)'
    references: purchase_orders.id
  -
    name: bill_number
    type: string
    meaning: 'The invoice number printed by the vendor; unique per vendor'
  -
    name: bill_date
    type: date
    meaning: 'The invoice date printed on the bill'
  -
    name: status
    type: string
    meaning: 'Lifecycle state: draft (being typed, editable), recorded (confirmed, read-only), cancelled (withdrawn with a reason; row kept)'
  -
    name: purchase_ledger_name
    type: string
    nullable: true
    meaning: 'The Tally purchase ledger the accountant selected for this bill (a recorded choice, not derived)'
  -
    name: subtotal
    type: decimal
    meaning: 'Sum of line amounts before tax, as printed'
    sensitive: rates
  -
    name: cgst
    type: decimal
    meaning: 'CGST amount as printed on the bill'
    sensitive: rates
  -
    name: sgst
    type: decimal
    meaning: 'SGST amount as printed on the bill'
    sensitive: rates
  -
    name: igst
    type: decimal
    meaning: 'IGST amount as printed on the bill'
    sensitive: rates
  -
    name: rounding
    type: decimal
    meaning: 'Signed round-off line as printed on the bill'
    sensitive: rates
  -
    name: total
    type: decimal
    meaning: 'Bill total = subtotal + CGST + SGST + IGST + rounding'
    sensitive: rates
  -
    name: attachment_path
    type: string
    nullable: true
    meaning: 'Storage path of the scanned bill file'
  -
    name: attachment_name
    type: string
    nullable: true
    meaning: 'Original filename of the scanned bill'
  -
    name: notes
    type: string
    nullable: true
    meaning: 'Free-text remarks on the bill'
  -
    name: cancelled_reason
    type: string
    nullable: true
    meaning: 'Reason given when the bill was cancelled'
  -
    name: created_by
    type: integer
    nullable: true
    meaning: 'User who started typing the bill (users)'
    references: users.id
  -
    name: recorded_by
    type: integer
    nullable: true
    meaning: 'User who confirmed the bill as recorded (users)'
    references: users.id
  -
    name: recorded_at
    type: datetime
    nullable: true
    meaning: 'When the bill was confirmed as recorded'
  -
    name: created_at
    type: datetime
    nullable: true
    meaning: 'When the row was created'
  -
    name: updated_at
    type: datetime
    nullable: true
    meaning: 'When the row was last changed'
joins:
  - 'supplier_bills.recorded_by = users.id'
  - 'supplier_bills.created_by = users.id'
  - 'supplier_bills.purchase_order_id = purchase_orders.id'
  - 'supplier_bills.vendor_id = vendors.id'
keywords:
  - 'supplier bill'
  - 'vendor invoice'
  - 'purchase invoice'
  - 'purchase bill'
  - payable
  - 'bill from supplier'
questions:
  - 'What is the total value of supplier bills recorded this month?'
  - 'Which supplier bills are still in draft?'
  - 'How many bills did each vendor send us last quarter?'
