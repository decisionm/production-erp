table: work_centers
module: machine-master
label: Machines
purpose: 'One row is one machine on the factory floor (an injection moulding machine, MC-01 ... MC-10): the machine master with its capability limits used by product standards and batch start.'
columns:
  -
    name: id
    type: integer
    meaning: 'Primary key'
  -
    name: code
    type: string
    meaning: 'Machine code, e.g. MC-01'
  -
    name: name
    type: string
    meaning: 'Machine name, e.g. Machine 1'
  -
    name: is_active
    type: integer
    meaning: '1 = active, 0 = deactivated'
  -
    name: created_at
    type: datetime
    nullable: true
    meaning: 'When the row was created'
  -
    name: updated_at
    type: datetime
    nullable: true
    meaning: 'When the row was last updated'
  -
    name: deleted_at
    type: datetime
    nullable: true
    meaning: 'Soft-delete timestamp; null means the row is live'
  -
    name: capacity_hours_per_day
    type: decimal
    nullable: true
    meaning: 'Effective available hours per day (shifts and efficiency netted in); null = capacity not configured'
  -
    name: display_sequence
    type: integer
    nullable: true
    meaning: 'Sort order for machine lists (Machine 10 after Machine 9); null sorts last'
  -
    name: capacity_class
    type: string
    nullable: true
    meaning: 'Free-text size/capacity class of the machine; null = not stated'
  -
    name: min_cavities
    type: integer
    nullable: true
    meaning: 'Minimum mould cavities the machine can run; null = no limit known'
  -
    name: max_cavities
    type: integer
    nullable: true
    meaning: 'Maximum mould cavities the machine can run; null = no limit known'
  -
    name: permitted_cavities
    type: string
    nullable: true
    meaning: 'JSON list of the exact cavity counts allowed (e.g. [6, 7, 8]) when not a continuous range; null = use min/max'
  -
    name: cycle_time_min
    type: decimal
    nullable: true
    meaning: 'Shortest permitted cycle time (seconds); null = no limit known'
  -
    name: cycle_time_max
    type: decimal
    nullable: true
    meaning: 'Longest permitted cycle time (seconds); null = no limit known'
  -
    name: default_shift_hours
    type: decimal
    nullable: true
    meaning: 'Default running hours per shift for this machine'
  -
    name: confirmation_status
    type: string
    nullable: true
    meaning: 'Whether the factory has confirmed these figures, free text such as "Discussion Confirmed" or "To Confirm"; null = not stated'
  -
    name: created_by
    type: integer
    nullable: true
    meaning: 'User who created the row (users.id)'
    references: users.id
  -
    name: updated_by
    type: integer
    nullable: true
    meaning: 'User who last updated the row (users.id)'
    references: users.id
joins:
  - 'work_centers.updated_by = users.id'
  - 'work_centers.created_by = users.id'
keywords:
  - machine
  - 'work center'
  - 'moulding machine'
  - MC
  - 'machine master'
  - capacity
  - cavities
questions:
  - 'Which machines are active?'
  - 'Which machines can run an 8-cavity mould?'
