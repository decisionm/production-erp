table: work_orders
module: production
label: 'Work Orders'
purpose: 'One row is a work order: an instruction to make a planned quantity of one item in one warehouse, optionally from a BOM and a routing. Releasing it issues the BOM materials from stock; completing it receives the finished quantity into stock at actual material cost per unit. The live factory floor runs on shift batches (shift_production_entries), not on this table.'
columns:
  -
    name: id
    type: integer
    meaning: 'Primary key'
  -
    name: item_id
    type: integer
    meaning: 'The item being made -> items'
    references: items.id
  -
    name: bom_id
    type: integer
    nullable: true
    meaning: 'BOM used to derive the material requirements; NULL if no materials are issued -> boms'
    references: boms.id
  -
    name: routing_id
    type: integer
    nullable: true
    meaning: 'Routing used for capacity load; NULL if none -> routings'
    references: routings.id
  -
    name: warehouse_id
    type: integer
    meaning: 'Warehouse the materials are issued from and the finished goods are received into -> warehouses'
    references: warehouses.id
  -
    name: quantity_planned
    type: decimal
    meaning: "Quantity of the item planned to be made, in the item's own unit of measure"
  -
    name: quantity_completed
    type: decimal
    meaning: 'Good quantity actually completed and received into stock (0 until completed)'
  -
    name: material_cost
    type: decimal
    meaning: 'Total value of materials issued at release (sum of quantity x stock unit cost); finished-goods unit cost = material_cost / quantity_completed'
    sensitive: rates
  -
    name: status
    type: string
    meaning: 'Lifecycle: draft (created), released (materials issued), completed (finished goods received)'
  -
    name: released_at
    type: datetime
    nullable: true
    meaning: 'When the order was released and materials issued'
  -
    name: completed_at
    type: datetime
    nullable: true
    meaning: 'When the order was completed'
  -
    name: created_by
    type: integer
    nullable: true
    meaning: 'User who created the order -> users'
    references: users.id
  -
    name: created_at
    type: datetime
    nullable: true
    meaning: 'When the row was created'
  -
    name: updated_at
    type: datetime
    nullable: true
    meaning: 'When the row was last changed'
  -
    name: scheduled_date
    type: date
    nullable: true
    meaning: 'The single day the routing load is planned against (capacity planning is single-day granularity)'
joins:
  - 'work_orders.created_by = users.id'
  - 'work_orders.warehouse_id = warehouses.id'
  - 'work_orders.routing_id = routings.id'
  - 'work_orders.bom_id = boms.id'
  - 'work_orders.item_id = items.id'
keywords:
  - 'work order'
  - 'production order'
  - 'job order'
  - WO
  - 'planned quantity'
  - released
questions:
  - 'Which work orders are released but not yet completed?'
  - 'How much of the planned quantity was completed on each work order this month?'
  - 'What work orders are scheduled for tomorrow?'
